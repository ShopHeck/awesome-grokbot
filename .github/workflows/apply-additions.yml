name: Apply Heckert template additions
on:
  workflow_dispatch:
  push:
    paths:
      - .github/scripts/apply-additions.py
      - .github/workflows/apply-additions.yml
permissions:
  contents: write
concurrency:
  group: apply-additions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Apply catalog entries
        run: python3 .github/scripts/apply-additions.py
      - name: Lint and regenerate READMEs
        run: python3 scripts/lint.py && python3 scripts/build_readme.py
      - name: Remove one-shot scaffolding
        run: rm -f .github/scripts/apply-additions.py .github/workflows/apply-additions.yml
      - name: Commit and push
        run: |
          git config user.name "Heck"
          git config user.email "76179499+ShopHeck@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Stick Cut, Covered, Distill, Undercut, Cut Man, Sponsor Scout, and Scorecard"
          git push
